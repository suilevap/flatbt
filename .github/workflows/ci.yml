name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The checks run offline, so fetch every dependency first.
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --offline --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --offline --workspace --all-features
      - run: sh scripts/check-features.sh
