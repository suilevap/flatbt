[workspace]
members = [".", "crates/flatbt-bevy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
flatbt = { path = "." }

[package]
name = "flatbt"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "An experimental behavior tree runtime with static dispatch and inline state"

[features]
default = ["std", "extras"]
# Diagnostics on stderr and `set_error_handler`. Without it the crate is `no_std`.
std = []
# The `nodes` and `scope` modules: actions, `choose!`, `scope!`.
extras = []

[[example]]
name = "action"
required-features = ["extras"]

[[example]]
name = "acts"
required-features = ["extras"]

[[example]]
name = "acts_dyn"
required-features = ["extras"]

[[example]]
name = "choose"
required-features = ["extras"]

[[example]]
name = "external_action"
required-features = ["extras"]

[[example]]
name = "scoped_params"
required-features = ["extras"]

[[example]]
name = "scoped_params_manual"
required-features = ["extras"]

[[test]]
name = "act"
required-features = ["extras"]

[[test]]
name = "action"
required-features = ["extras"]

[[test]]
name = "cancel"
required-features = ["extras"]

[[test]]
name = "choose"
required-features = ["extras"]

[[test]]
name = "external_action"
required-features = ["extras"]

[[test]]
name = "scope"
required-features = ["extras"]

[[test]]
name = "errors"
required-features = ["std"]

[[test]]
name = "catalog"
required-features = ["extras"]

[[test]]
name = "utility"
required-features = ["extras"]
