[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
flatbt-core = { path = "crates/flatbt-core" }
flatbt-nodes = { path = "crates/flatbt-nodes", default-features = false }
flatbt-scope = { path = "crates/flatbt-scope" }

[package]
name = "flatbt"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "An experimental behavior tree runtime with optional composition helpers"

[features]
default = ["choose", "scope", "action"]
action = ["dep:flatbt-nodes", "flatbt-nodes/action"]
choose = ["dep:flatbt-nodes", "flatbt-nodes/choose"]
scope = ["dep:flatbt-scope"]

[dependencies]
flatbt-core.workspace = true
flatbt-nodes = { workspace = true, optional = true }
flatbt-scope = { workspace = true, optional = true }

[[example]]
name = "acts"
required-features = ["action"]

[[example]]
name = "acts_dyn"
required-features = ["action"]

[[example]]
name = "action"
required-features = ["action"]

[[example]]
name = "external_action"
required-features = ["action"]

[[example]]
name = "choose"
required-features = ["choose"]

[[example]]
name = "scoped_params"
required-features = ["scope", "action"]

[[example]]
name = "scoped_params_manual"
required-features = ["scope", "action"]

[[test]]
name = "act"
required-features = ["action", "choose"]

[[test]]
name = "action"
required-features = ["action"]

[[test]]
name = "cancel"
required-features = ["action"]

[[test]]
name = "external_action"
required-features = ["action"]

[[test]]
name = "choose"
required-features = ["choose"]

[[test]]
name = "scope"
required-features = ["scope", "action"]
