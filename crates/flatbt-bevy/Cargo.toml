[package]
name = "flatbt-bevy"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Bevy ECS integration for FlatBT"
rust-version = "1.95"

[dependencies]
flatbt-core.workspace = true
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
# The clock handed to `tick_mode`.
bevy_time = { version = "0.19", default-features = false, features = ["std"] }

[dev-dependencies]
# Exercises the parallel tick on real threads; the main dependency leaves the
# choice to the consuming app.
bevy_ecs = { version = "0.19", default-features = false, features = ["std", "multi_threaded"] }
flatbt-nodes = { workspace = true, features = ["action", "choose"] }
flatbt-scope.workspace = true
