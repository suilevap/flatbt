<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="910" viewBox="0 0 1120 910" role="img" aria-labelledby="title desc">
  <title id="title">FlatBT: static tree definitions and per-agent inline state</title>
  <desc id="desc">A Selector owns a tuple containing a Sequence and Idle. The Sequence owns Check and Move. Each agent borrows the same tree and owns inline nested state. The shown agent runs Move: the root enum selects Sequence and the nested enum selects MoveState. Child enums reserve their largest alternative, not all alternatives together. New candidates use temporary stack state.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 650; }
      .body { font-size: 16px; }
      .note { font-size: 14px; fill: #475569; }
      .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 15px; }
      .smallcode { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #475569; }
      .outline { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .definition { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .active { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="910" rx="16" fill="#ffffff"/>
  <text x="32" y="43" class="title">One shared definition. Inline state per agent.</text>
  <text x="32" y="72" class="note">Static dispatch · Nested Rust values · No runtime-owned node or frame allocations</text>

  <rect x="32" y="94" width="1056" height="138" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="123" class="code">select((seq((check(can_move), Move)), Idle))</text>
  <text x="50" y="152" class="smallcode">ControlNode&lt;Selector, (</text>
  <text x="70" y="173" class="smallcode">ControlNode&lt;Sequence, (Check&lt;F&gt;, Move)&gt;, Idle</text>
  <text x="50" y="194" class="smallcode">)&gt;</text>
  <text x="50" y="216" class="note">F = predicate type. Move and Idle are application-defined nodes.</text>

  <text x="32" y="271" class="label">DEFINITION · BUILT ONCE</text>
  <text x="552" y="271" class="label">AGENT A · CURRENTLY RUNNING MOVE</text>

  <rect x="32" y="286" width="444" height="366" rx="10" class="definition"/>
  <text x="50" y="315" class="heading">Tree</text>
  <text x="50" y="343" class="code">policy: Selector</text>
  <text x="50" y="370" class="code">children: (SequenceNode, Idle)</text>

  <rect x="52" y="390" width="404" height="145" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="68" y="416" class="code">children.0: ControlNode</text>
  <text x="68" y="443" class="code">policy: Sequence</text>
  <text x="68" y="470" class="code">children: (Check&lt;F&gt;, Move)</text>
  <text x="68" y="510" class="note">Predicate and Move configuration stored here.</text>

  <rect x="52" y="552" width="404" height="49" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="68" y="582" class="code">children.1: Idle</text>
  <text x="50" y="629" class="note">All definitions exist, including inactive branches.</text>

  <rect x="552" y="286" width="536" height="366" rx="10" class="outline"/>
  <text x="570" y="315" class="heading">BtState</text>
  <text x="570" y="344" class="code">root_node: &amp;Tree</text>
  <path d="M555 339 H482" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="570" y="365" width="500" height="257" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="588" y="393" class="code">root_state: Some(Tree::State)</text>
  <text x="588" y="420" class="smallcode">ControlState { inner: (), children: Child0(...) }</text>

  <rect x="589" y="440" width="462" height="156" rx="8" class="active"/>
  <text x="607" y="468" class="code">Sequence state</text>
  <text x="607" y="495" class="smallcode">inner: ()</text>
  <text x="607" y="520" class="smallcode">children: Child1(Move::State)</text>
  <rect x="608" y="539" width="424" height="39" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="624" y="565" class="code">Move::State · owned invocation data</text>
  <text x="570" y="641" class="note">Check and Idle have no live state in this snapshot.</text>

  <rect x="552" y="670" width="536" height="70" rx="10" class="outline"/>
  <text x="570" y="697" class="body">Agent B: another BtState, same &amp;Tree</text>
  <text x="570" y="721" class="note">Independent progress and owned state.</text>
  <path d="M552 703 H507 V352 H482" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="32" y="682" class="label">STATE LAYOUT</text>
  <text x="32" y="709" class="body">Nested structs/enums stored inline in one value.</text>
  <text x="32" y="734" class="body">Child enum: Empty | Child0(S0) | Child1(S1)</text>
  <text x="32" y="759" class="body">Child capacity ≈ max(S0, S1) + tag/alignment.</text>

  <rect x="32" y="787" width="1056" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="813" class="label">DURING UPDATE</text>
  <text x="50" y="839" class="body">Resume borrows saved state in place. A fresh candidate uses temporary stack state.</text>
  <text x="50" y="863" class="note">Running replaces the old variant. Terminal candidates drop. User-owned state may allocate heap resources.</text>
  <text x="32" y="899" class="note">Ownership diagram; field offsets and byte layout are chosen by Rust.</text>
</svg>
