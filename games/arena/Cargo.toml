[package]
name = "arena"
version = "0.1.0"
edition = "2024"
publish = false
description = "A load test for the FlatBT Bevy integration, shaped like a game"

# Its own workspace: the repository's checks should not build Bevy's renderer.
[workspace]

[dependencies]
flatbt = { path = "../..", features = ["bevy"] }
bevy = { version = "0.19", default-features = false, features = [
  "bevy_window",
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_ui",
  "bevy_text",
  "default_font",
  "bevy_log",
  "x11",
  "multi_threaded",
] }

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[[bin]]
name = "scaling"
path = "src/bin/scaling.rs"
